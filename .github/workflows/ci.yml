name: ShopSense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Database Schema Sync & Seed
        run: |
          npx prisma db push
          npm run db:seed

      - name: Run Multi-Tenant Security & Auth Tests
        run: npm run test:auth

      - name: Run Inventory Concurrency Stress Tests
        run: npm run test:inventory

      - name: Run Recommendation Offline Evaluation
        run: npm run eval:recommendations

      - name: Run Demand Forecasting Offline Evaluation
        run: npm run eval:forecast

      - name: Production Build
        run: npm run build
